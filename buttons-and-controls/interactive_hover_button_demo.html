<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Hover Button</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: light-dark(#f8f8fa, #111113);
        --card: light-dark(#ffffff, #19191c);
        --foreground: light-dark(#18181b, #f4f4f5);
        --muted: light-dark(#71717a, #a1a1aa);
        --border: light-dark(#e4e4e7, #3f3f46);
        --primary: light-dark(#18181b, #f4f4f5);
        --primary-foreground: light-dark(#fafafa, #18181b);
        --ring: light-dark(#71717a, #d4d4d8);
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main { width: min(100% - 2rem, 52rem); }

      .heading { margin-bottom: 1.5rem; }
      .eyebrow { margin: 0 0 .65rem; color: var(--muted); font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(1.75rem, 4vw, 2.5rem); letter-spacing: -.05em; }

      .demo {
        min-height: 28rem;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        background: var(--card);
        box-shadow: 0 1.5rem 5rem rgb(0 0 0 / .08);
      }

      .button-wrap { text-align: center; }
      .hint { margin: 1.25rem 0 0; color: var(--muted); font-size: .875rem; }

      .interactive-hover-button {
        isolation: isolate;
        position: relative;
        display: inline-flex;
        width: 10.5rem;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 9999px;
        background: var(--card);
        padding: .8rem 1rem;
        color: var(--foreground);
        font: inherit;
        font-size: .875rem;
        font-weight: 650;
        line-height: 1;
      }

      .interactive-hover-button:focus-visible {
        outline: 3px solid var(--ring);
        outline-offset: 4px;
      }

      .button-label,
      .button-hover-label,
      .button-orb { transition: all .3s ease; }

      .button-label {
        position: relative;
        z-index: 2;
        display: inline-flex;
        transform: translateX(.25rem);
      }

      .button-hover-label {
        position: absolute;
        z-index: 3;
        top: 0;
        display: flex;
        height: 100%;
        width: 100%;
        transform: translateX(3rem);
        align-items: center;
        justify-content: center;
        gap: .45rem;
        color: var(--primary-foreground);
        opacity: 0;
      }

      .button-hover-label svg { width: 1.15rem; height: 1.15rem; }

      .button-orb {
        position: absolute;
        z-index: 1;
        top: 40%;
        left: 20%;
        width: .5rem;
        height: .5rem;
        transform: scale(1);
        border-radius: .35rem;
        background: var(--primary);
      }

      .interactive-hover-button:hover .button-label,
      .interactive-hover-button:focus-visible .button-label {
        transform: translateX(3rem);
        opacity: 0;
      }

      .interactive-hover-button:hover .button-hover-label,
      .interactive-hover-button:focus-visible .button-hover-label {
        transform: translateX(-.25rem);
        opacity: 1;
      }

      .interactive-hover-button:hover .button-orb,
      .interactive-hover-button:focus-visible .button-orb {
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform: scale(1.8);
      }

      @media (prefers-reduced-motion: reduce) {
        .button-label, .button-hover-label, .button-orb { transition-duration: .01ms; }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="heading">
        <p class="eyebrow">Demo de componente</p>
        <h1>Interactive Hover Button</h1>
      </header>
      <section class="demo" aria-label="Vista previa del botón">
        <div class="button-wrap">
          <button class="interactive-hover-button" type="button">
            <span class="button-label">Get started</span>
            <span class="button-hover-label">
              Get started
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14" />
                <path d="m12 5 7 7-7 7" />
              </svg>
            </span>
            <span class="button-orb" aria-hidden="true"></span>
          </button>
          <p class="hint">Pasa el cursor o enfoca el botón con Tab.</p>
        </div>
      </section>
    </main>
  </body>
</html>
